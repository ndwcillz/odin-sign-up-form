<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Odin | Sign Up Form</title>
</head>
<body>
    <div id="left_column">
        <h1 id="logo_text"></h1>
        <p id="image_creds"></p>
    </div>
    <div id="right_column">
        <div id="form_pretext">
            <p id="description"></p>
            <p id="cta"></p>
        </div>
        <form id="form">
            <h2 id="form_header"></h2>
            <div id="form_naming" class="form_row">
                <div class="form_element">
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" id="first_name" name="firstname" placeholder="John">
                </div>
                <div class="form_element">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" name="lastname" placeholder="Smith">
                </div>
            </div>
            <div id="form_contact" class="form_row">
                <div class="form_element">
                    <label for="user_email">EMAIL</label>
                    <input type="email" id="user_email" name="email" placeholder="johnsmith@example.com">
                </div>
                <div class="form_element">
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="tel" id="phone_number" name="phone" placeholder="123-456-7890">
                </div>
            </div>
            <div id="form_password" class="form_row">
                <div class="form_element">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password">
                </div>
                <div class="form_element">
                    <label for="confirm_password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm_password" name="passconf">
                </div>
            </div>
            <div id="form_footer">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
