<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Odin | Sign Up Form</title>
</head>
<body>
    <div id="left_column">
        <div id="logo">
            <img src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Image of the Odin Logo" id="logo_img">
            <h1 id="logo_text">ODIN</h1>
        </div>
        <p id="image_creds">Photo by <a href="https://unsplash.com/@hddimitrov">Hristo Dimitrov</a> on <a href="https://unsplash.com">Unsplash</a></p>
    </div>
    <div id="right_column">
        <div id="form_pretext">
            <p class="text" id="description">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
            <p class="text" id="cta">You <i>know</i> you want to.</p>
        </div>
        <form id="form">
            <h2 id="form_header" class="text">Let's do this!</h2>
            <div id="form_inputs">
                <div id="form_naming" class="form_row">
                    <div class="form_element">
                        <label class="form_label" for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="firstname" placeholder="John">
                    </div>
                    <div class="form_element">
                        <label class="form_label" for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="lastname" placeholder="Smith">
                    </div>
                </div>
                <div id="form_contact" class="form_row">
                    <div class="form_element">
                        <label class="form_label" for="user_email">EMAIL</label>
                        <input type="email" id="user_email" name="email" placeholder="johnsmith@example.com">
                    </div>
                    <div class="form_element">
                        <label class="form_label" for="phone_number">PHONE NUMBER</label>
                        <input type="tel" id="phone_number" name="phone" placeholder="123-456-7890">
                    </div>
                </div>
                <div id="form_password" class="form_row">
                    <div class="form_element">
                        <label class="form_label" for="password">PASSWORD</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="form_element">
                        <label class="form_label" for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="passconf">
                    </div>
                </div>
            </div>
            <div id="form_footer">
                <button id="form_button" type="submit">Create Account</button>
                <p id="footer_text">Already have an account? <a id="log_in_link" href="#">Log in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
